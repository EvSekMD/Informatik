<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Toaster-Algorithmus</title>
<style>
  :root{
    --rot:#cf5f41; --rot-dunkel:#a8442b; --creme:#fbf3e4; --brot:#e9cfa6;
    --tinte:#2b2420; --grau:#6f6660; --linie:#e2d5c0;
    --gut:#2f8f5b; --gut-bg:#e2f4e9; --falsch:#c0392b; --falsch-bg:#fbe4e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif;
    background:var(--creme); color:var(--tinte);
    -webkit-user-select:none; user-select:none;
    padding:env(safe-area-inset-top) 12px 24px;
  }
  .seite{max-width:860px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
  h1{font-size:1.45rem;margin:0;letter-spacing:.01em}
  .level{display:flex;gap:6px}
  .level span{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:.95rem;background:#fff;border:2px solid var(--linie);color:var(--grau)
  }
  .level span.aktiv{background:var(--rot);border-color:var(--rot-dunkel);color:#fff}
  .level span.fertig{background:var(--gut);border-color:var(--gut);color:#fff}

  .eva{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
  .eva figure{
    margin:0;background:#fff;border:2px solid var(--linie);border-radius:16px;
    padding:6px 6px 8px;text-align:center
  }
  .eva img{height:86px;max-width:100%;object-fit:contain;display:block;margin:0 auto}
  .eva figcaption{font-weight:700;font-size:.95rem;margin-top:2px}
  .eva figcaption small{display:block;font-weight:500;color:var(--grau);font-size:.78rem}

  .auftrag{
    background:#fff;border-left:6px solid var(--rot);border-radius:10px;
    padding:10px 14px;margin:0 0 10px;font-size:1.05rem;line-height:1.35
  }
  .auftrag b{color:var(--rot-dunkel)}

  ol.schritte{list-style:none;margin:0;padding:0;counter-reset:nr}
  ol.schritte li{
    counter-increment:nr;position:relative;
    display:flex;align-items:center;gap:12px;
    background:#fff;border:2px solid var(--linie);border-radius:14px;
    padding:8px 12px 8px 8px;margin-bottom:7px;min-height:52px;
    touch-action:none;cursor:grab;
    transition:background .15s,border-color .15s,box-shadow .15s
  }
  ol.schritte li::before{
    content:counter(nr);flex:none;width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;font-weight:800;background:var(--brot);color:var(--tinte)
  }
  ol.schritte li .text{flex:1;font-size:1.05rem;font-weight:600;line-height:1.25}
  ol.schritte li .text small{display:block;font-weight:500;color:var(--grau);font-size:.86rem;margin-top:2px}
  ol.schritte li .griff{flex:none;color:#c9b99f;font-size:1.3rem;line-height:1}
  ol.schritte li.zieht{
    z-index:5;cursor:grabbing;border-color:var(--rot);
    box-shadow:0 10px 24px rgba(60,30,10,.25);transition:none
  }
  ol.schritte li.gut{background:var(--gut-bg);border-color:var(--gut)}
  ol.schritte li.gut::before{background:var(--gut);color:#fff}
  ol.schritte li.falsch{background:var(--falsch-bg);border-color:var(--falsch)}
  ol.schritte li.falsch::before{background:var(--falsch);color:#fff}
  ol.schritte.fest li{touch-action:auto;cursor:default}
  ol.schritte.fest li .griff{visibility:hidden}
  ol.schritte.waehlen li{cursor:pointer}
  ol.schritte.waehlen li:active{transform:scale(.99)}

  .leiste{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  button{
    font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:14px;
    padding:13px 22px;background:var(--rot);color:#fff;cursor:pointer;
    box-shadow:0 4px 0 var(--rot-dunkel)
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rot-dunkel)}
  button.zweit{background:#fff;color:var(--tinte);box-shadow:0 4px 0 var(--linie);border:2px solid var(--linie)}
  .meldung{flex:1;min-width:200px;font-size:1.02rem;font-weight:600;line-height:1.35}
  .meldung.gut{color:var(--gut)} .meldung.falsch{color:var(--falsch)}

  .karte{background:#fff;border:2px solid var(--linie);border-radius:18px;padding:18px;margin-top:6px}
  .karte h2{margin:0 0 4px;font-size:1.2rem}
  .karte p{margin:6px 0;line-height:1.45;font-size:1.03rem}
  .frage-nr{color:var(--grau);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
  .antworten{display:grid;gap:9px;margin-top:12px}
  .antworten button{
    text-align:left;background:#fff;color:var(--tinte);border:2px solid var(--linie);
    box-shadow:0 3px 0 var(--linie);font-weight:600
  }
  .antworten button.gut{background:var(--gut-bg);border-color:var(--gut);box-shadow:0 3px 0 var(--gut)}
  .antworten button.falsch{background:var(--falsch-bg);border-color:var(--falsch);box-shadow:0 3px 0 var(--falsch)}
  .antworten button:disabled{cursor:default;opacity:1}
  .regel{
    margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--gut-bg);
    border:2px solid var(--gut);font-weight:700
  }
  .regel small{display:block;font-weight:500;margin-top:2px}

  .ende{text-align:center}
  .ende img{height:150px;animation:huepf 1s ease-in-out infinite alternate}
  @keyframes huepf{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
  .sterne{font-size:2.4rem;letter-spacing:6px;margin:4px 0}
  .merk{
    text-align:left;background:var(--creme);border-radius:14px;padding:12px 16px;margin:12px 0
  }
  .merk h3{margin:0 0 4px;font-size:1.02rem;color:var(--rot-dunkel)}
  .merk ol{margin:6px 0 0;padding-left:22px;line-height:1.5}
  [hidden]{display:none!important}
  @media (max-width:520px){
    h1{font-size:1.15rem} .eva img{height:62px}
    ol.schritte li .text{font-size:.98rem}
  }
  @media (prefers-reduced-motion:reduce){.ende img{animation:none}}
</style>
</head>

    <h2 id="endeTitel">Geschafft!</h2>
    <div class="merk">
      <h3>Merksatz</h3>
      Ein <b>Algorithmus</b> ist eine genaue Schritt-für-Schritt-Anleitung, mit der man ein Problem löst.

      <h3>Die drei Regeln</h3>
      <ol>
        <li>Jeder Schritt ist <b>eindeutig</b>.</li>

<script>
(function(){
  "use strict";

  var SCHRITTE = [
    {t:"Brot einlegen"},
    {t:"Bräunungsstufe wählen"},
    {t:"Hebel herunterdrücken"},
    {t:"Heizdrähte einschalten"},
    {t:"Prüfen: Ist die Zeit abgelaufen?", s:"Nein → weiter heizen und noch einmal prüfen · Ja → nächster Schritt"},
    {t:"Heizdrähte ausschalten"},
    {t:"Toast auswerfen"}
  ];
  var ENTSCHEIDUNG = 4;

  var FRAGEN = [
    {
      f:"Jemand vertauscht zwei Schritte: erst „Hebel herunterdrücken“, dann „Brot einlegen“. Was passiert?",
      a:["Der Toaster heizt, obwohl noch kein Brot drin ist.","Nichts, die Reihenfolge ist egal.","Der Toast wird schneller fertig."],
      r:"Regel: Die Reihenfolge muss stimmen.",
      e:"Ein Computer macht die Schritte genau so, wie sie dastehen."
    },
    {
      f:"Der Schritt „Prüfen: Ist die Zeit abgelaufen?“ fehlt. Was passiert?",
      a:["Der Toaster heizt immer weiter und das Brot verbrennt.","Der Toast springt sofort heraus.","Der Toaster schaltet sich gar nicht ein."],
      r:"Regel: Ein Algorithmus braucht ein Ende.",
      e:"Ohne die Prüfung weiß der Toaster nie, wann er aufhören soll."
    },
    {
      f:"Statt „Bräunungsstufe wählen“ steht da: „Mach den Toast lecker.“ Warum ist das ein Problem?",
      a:["Der Toaster weiß nicht genau, was er tun soll.","Der Satz ist zu lang.","Toaster können nicht lesen."],
      r:"Regel: Jeder Schritt muss eindeutig sein.",
      e:"„Lecker“ versteht jeder anders. Ein Computer braucht genaue Angaben."
    }
  ];

  var el = function(id){ return document.getElementById(id); };
  var liste = el("liste"), meldung = el("meldung"), auftrag = el("auftrag");
  var btnPruefen = el("pruefen"), btnWeiter = el("weiter");
  var phase = 1, fehler = 0, frageIdx = 0;

  function mischen(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  // Schritt 1/2 und Schritt 6/7 dürfen jeweils vertauscht sein.
  function passt(id, pos){
    if (id === pos) return true;
    if (id <= 1 && pos <= 1) return true;
    if (id >= 5 && pos >= 5) return true;
    return false;
  }
  function reihenfolge(){
    return Array.prototype.map.call(liste.children, function(li){ return +li.dataset.id; });
  }
  function anzahlRichtig(ids){
    return ids.filter(function(id, pos){ return passt(id, pos); }).length;
  }

  function setMeldung(text, art){
    meldung.textContent = text;
    meldung.className = "meldung" + (art ? " " + art : "");
  }
  function setLevel(n){
    [1,2,3].forEach(function(i){
      var s = el("l" + i);
      s.className = i < n ? "fertig" : (i === n ? "aktiv" : "");
      s.textContent = i < n ? "✓" : i;
    });
  }

  function baueListe(ids){
    liste.innerHTML = "";
    ids.forEach(function(id){
      var li = document.createElement("li");
      li.dataset.id = id;
      var text = document.createElement("div");
      text.className = "text";
      text.textContent = SCHRITTE[id].t;
      if (SCHRITTE[id].s){
        var sm = document.createElement("small");
        sm.textContent = SCHRITTE[id].s;
        text.appendChild(sm);
      }
      var griff = document.createElement("div");
      griff.className = "griff";
      griff.setAttribute("aria-hidden", "true");
      griff.textContent = "☰";
      li.appendChild(text);
      li.appendChild(griff);
      liste.appendChild(li);
    });
  }

  // ---------- Level 1: Sortieren ----------
  function startLevel1(){
    phase = 1; fehler = 0; frageIdx = 0;
    setLevel(1);
    el("eva").hidden = false;
    el("teilListe").hidden = false;
    el("teilQuiz").hidden = true;
    el("teilEnde").hidden = true;
    liste.className = "schritte";
    auftrag.innerHTML = "<b>Level 1:</b> Was macht der Toaster Schritt für Schritt? Ziehe die Karten in die richtige Reihenfolge.";
    var ids;
    do { ids = mischen([0,1,2,3,4,5,6]); } while (anzahlRichtig(ids) > 2);
    baueListe(ids);
    btnPruefen.hidden = false;
    btnWeiter.hidden = true;
    setMeldung("");
  }

  function pruefen(){
    var ids = reihenfolge(), richtig = 0;
    Array.prototype.forEach.call(liste.children, function(li, pos){
      var ok = passt(+li.dataset.id, pos);
      li.classList.toggle("gut", ok);
      li.classList.toggle("falsch", !ok);
      if (ok) richtig++;
    });
    if (richtig === ids.length){
      liste.classList.add("fest");
      btnPruefen.hidden = true;
      btnWeiter.hidden = false;
      setMeldung("Super! Genau so arbeitet der Toaster.", "gut");
    } else {
      fehler++;
      setMeldung(richtig + " von " + ids.length + " Schritten stehen richtig. Verschiebe die roten Karten.", "falsch");
    }
  }

  // Ziehen mit Finger, Stift oder Maus
  var zug = null;
  liste.addEventListener("pointerdown", function(e){
    if (phase !== 1 || liste.classList.contains("fest")) return;
    var li = e.target.closest("li");
    if (!li || zug) return;
    e.preventDefault();
    zug = {li: li, startY: e.clientY, id: e.pointerId};
    try { li.setPointerCapture(e.pointerId); } catch (err) {}
    li.classList.add("zieht");
    Array.prototype.forEach.call(liste.children, function(x){ x.classList.remove("gut", "falsch"); });
    setMeldung("");
  });
  liste.addEventListener("pointermove", function(e){
    if (!zug || e.pointerId !== zug.id) return;
    e.preventDefault();
    var li = zug.li;
    li.style.transform = "translateY(" + (e.clientY - zug.startY) + "px)";
    var r = li.getBoundingClientRect(), mitte = r.top + r.height / 2;
    var vor = li.previousElementSibling, nach = li.nextElementSibling;
    var altTop = li.offsetTop, getauscht = false;
    if (vor){
      var rv = vor.getBoundingClientRect();
      if (mitte < rv.top + rv.height / 2){ liste.insertBefore(li, vor); getauscht = true; }
    }
    if (!getauscht && nach){
      var rn = nach.getBoundingClientRect();
      if (mitte > rn.top + rn.height / 2){ liste.insertBefore(nach, li); getauscht = true; }
    }
    if (getauscht){
      zug.startY += li.offsetTop - altTop;
      li.style.transform = "translateY(" + (e.clientY - zug.startY) + "px)";
    }
  });
  function zugEnde(e){
    if (!zug || (e && e.pointerId !== zug.id)) return;
    zug.li.classList.remove("zieht");
    zug.li.style.transform = "";
    zug = null;
  }
  liste.addEventListener("pointerup", zugEnde);
  liste.addEventListener("pointercancel", zugEnde);

  // ---------- Level 2: Entscheidung finden ----------
  function startLevel2(){
    phase = 2;
    setLevel(2);
    baueListe([0,1,2,3,4,5,6]);
    liste.className = "schritte fest waehlen";
    auftrag.innerHTML = "<b>Level 2:</b> In einem Schritt muss der Toaster etwas <b>entscheiden</b>: Ja oder Nein? Tippe diesen Schritt an.";
    btnPruefen.hidden = true;
    btnWeiter.hidden = true;
    setMeldung("");
  }
  liste.addEventListener("click", function(e){
    if (phase !== 2 || !btnWeiter.hidden) return;
    var li = e.target.closest("li");
    if (!li) return;
    if (+li.dataset.id === ENTSCHEIDUNG){
      Array.prototype.forEach.call(liste.children, function(x){ x.classList.remove("falsch"); });
      li.classList.add("gut");
      liste.classList.remove("waehlen");
      setMeldung("Richtig! Bei „Nein“ heizt der Toaster weiter und prüft noch einmal. So eine Wiederholung nennt man Schleife.", "gut");
      btnWeiter.hidden = false;
    } else {
      fehler++;
      li.classList.add("falsch");
      setMeldung("Hier tut der Toaster einfach etwas. Wo stellt er sich eine Frage?", "falsch");
    }
  });

  // ---------- Level 3: Was passiert, wenn ...? ----------
  function startLevel3(){
    phase = 3;
    setLevel(3);
    el("eva").hidden = true;
    el("teilListe").hidden = true;
    el("teilQuiz").hidden = false;
    frageIdx = 0;
    zeigeFrage();
  }
  function zeigeFrage(){
    var q = FRAGEN[frageIdx], box = el("antworten");
    el("frageNr").textContent = "Level 3 · Frage " + (frageIdx + 1) + " von " + FRAGEN.length;
    el("frageText").textContent = q.f;
    el("regel").hidden = true;
    el("quizWeiter").hidden = true;
    box.innerHTML = "";
    mischen([0,1,2]).forEach(function(i){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = q.a[i];
      b.addEventListener("click", function(){
        if (i === 0){
          b.classList.add("gut");
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          var regel = el("regel");
          regel.textContent = q.r;
          var sm = document.createElement("small");
          sm.textContent = q.e;
          regel.appendChild(sm);
          regel.hidden = false;
          el("quizWeiter").hidden = false;
        } else {
          fehler++;
          b.classList.add("falsch");
          b.disabled = true;
        }
      });
      box.appendChild(b);
    });
  }

  function zeigeEnde(){
    phase = 4;
    setLevel(4);
    el("teilQuiz").hidden = true;
    el("teilEnde").hidden = false;
    var n = fehler === 0 ? 3 : (fehler <= 3 ? 2 : 1);
    el("sterne").textContent = "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n);
    el("endeTitel").textContent = n === 3 ? "Perfekt! Du denkst wie ein Programmierer." : "Geschafft! Der Toast ist fertig.";
    window.scrollTo(0, 0);
  }

  btnPruefen.addEventListener("click", pruefen);
  btnWeiter.addEventListener("click", function(){
    if (phase === 1) startLevel2(); else if (phase === 2) startLevel3();
  });
  el("quizWeiter").addEventListener("click", function(){
    frageIdx++;
    if (frageIdx < FRAGEN.length) zeigeFrage(); else zeigeEnde();
  });
  el("nochmal").addEventListener("click", startLevel1);

  startLevel1();
})();
</script>
</body>
</html>
